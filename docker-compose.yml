services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pixelpay
      MYSQL_USER: pixelpay
      MYSQL_PASSWORD: pixelpay
      MYSQL_DATABASE: pixelpay
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pixelpay", "-ppixelpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass pixelpay
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pixelpay", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api.dev
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    ports:
      - "4000:3000"
    env_file: .env
    environment:
      DATABASE_URL: mysql://pixelpay:pixelpay@mysql:3306/pixelpay
      REDIS_URL: redis://:pixelpay@redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web.dev
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    ports:
      - "4001:3001"
    env_file: .env
    environment:
      API_URL_INTERNAL: http://api:3000/api/v1
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
